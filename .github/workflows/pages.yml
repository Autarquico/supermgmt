name: pages

# The website follows releases: its content (docs/ and the TUI golden frames) comes from a release
# tag, never from a branch. The site tooling (site/) comes from main, so a fix to the website never
# needs a new release. It runs after the release workflow finishes successfully for a v* tag (a release
# created with the workflow token does not fire `release: published`). A manual dispatch rebuilds the
# latest published release (pre-releases included) with the current tooling.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="$RELEASE_TAG"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$(gh api "repos/$REPOSITORY/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name')"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag: '$tag'" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: site tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: content from the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: release
          persist-credentials: false
      - name: the tag still points at the commit the release was built from
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EXPECTED_SHA" ] && [ "$(git -C release rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "tag moved: HEAD is $(git -C release rev-parse HEAD), release ran on $EXPECTED_SHA" >&2
            exit 1
          fi
      - name: use the release's docs and TUI frames
        run: |
          rm -rf docs internal/tui/testdata
          cp -R release/docs docs
          cp -R release/internal/tui/testdata internal/tui/testdata
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: build and crawl the site for this tag (its docs passed docs-check in the release gates)
        env:
          SITE_VERSION: ${{ steps.tag.outputs.tag }}
        run: make site-check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # Publishes the artifact and nothing else: no checkout, no npm, no secrets.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
