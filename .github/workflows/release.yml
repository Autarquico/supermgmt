name: release

# Builds, signs and publishes a release. Runs only for v* tags. The build job runs third-party code and
# holds no secret and no write permission; only sign-publish, in the protected `release` environment
# (owner as required reviewer), sees the signing key, and it executes nothing from the build but data.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is built or signed unless every check in packaging/release/required-checks.txt (all of
  # ci.yml plus the nightly run) succeeded on this exact commit. The only job that reads checks.
  gates:
    if: github.repository == 'autarquico/supermgmt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: required checks succeeded on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" >"$RUNNER_TEMP/check-runs.json"
          packaging/release/require-checks.sh packaging/release/required-checks.txt "$RUNNER_TEMP/check-runs.json"

  build:
    needs: gates
    if: github.repository == 'autarquico/supermgmt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dist-digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
      - name: record what was built
        id: manifest
        run: |
          cd dist
          sha256sum sm_*.tar.gz sm_*.tar.gz.spdx.json >SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/sm_*.tar.gz
            dist/sm_*.tar.gz.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error

  sign-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must point into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: verify the artifact is what the build job recorded
        env:
          WANT_DIGEST: ${{ needs.build.outputs.dist-digest }}
        run: |
          cd dist
          [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$WANT_DIGEST" ]
          sha256sum -c SHA256SUMS
          [ "$(find . -maxdepth 1 -type f \( -name 'sm_*.tar.gz' -o -name 'sm_*.tar.gz.spdx.json' \) -printf '%f\n' | sort)" = "$(cut -c67- SHA256SUMS | sort)" ]
          rm SHA256SUMS
      - name: sign checksums, install.sh and join.sh
        env:
          SM_RELEASE_SIGNING_KEY: ${{ secrets.SM_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SM_RELEASE_SIGNING_KEY" >"$key"
          SM_SIGNING_KEY_FILE="$key" packaging/release/finalize.sh dist "$TAG"
      - name: module cache for the notices and SBOM comparison
        run: go mod download
      - name: verify against the trust root embedded in install.sh, notices and SBOMs against the compiled modules
        run: packaging/release/check.sh dist install.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/sm_*.tar.gz
            dist/checksums.txt
      - name: provenance names exactly what is published, built from this commit by this workflow
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          statement="$RUNNER_TEMP/provenance.json"
          jq -r '.dsseEnvelope.payload' "$BUNDLE" | base64 -d >"$statement"
          packaging/release/verify-provenance.sh "$statement" dist "$GITHUB_SHA" "$REPO" "$TAG"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/sm_*.tar.gz dist/sm_*.tar.gz.spdx.json dist/checksums.txt dist/checksums.txt.sig dist/install.sh dist/install.sh.sig)
          for f in dist/join.sh dist/join.sh.sig; do [ ! -f "$f" ] || files+=("$f"); done
          flags=(--verify-tag --title "$TAG" --generate-notes)
          case $TAG in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" "${files[@]}"
