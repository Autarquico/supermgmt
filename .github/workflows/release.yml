name: release

# Builds, signs and publishes a release. Runs only for v* tags, in the protected `release`
# environment (owner as required reviewer). The signing key exists only as that environment's secret.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'autarquico/supermgmt'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must point into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
      - name: sign checksums, install.sh and join.sh
        env:
          SM_RELEASE_SIGNING_KEY: ${{ secrets.SM_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SM_RELEASE_SIGNING_KEY" >"$key"
          SM_SIGNING_KEY_FILE="$key" packaging/release/finalize.sh dist "$TAG"
      - name: verify against the trust root embedded in install.sh
        run: packaging/release/check.sh dist install.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sm_*.tar.gz
            dist/checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/sm_*.tar.gz dist/sm_*.tar.gz.spdx.json dist/checksums.txt dist/checksums.txt.sig dist/install.sh dist/install.sh.sig)
          for f in dist/join.sh dist/join.sh.sig; do [ ! -f "$f" ] || files+=("$f"); done
          flags=(--verify-tag --title "$TAG" --generate-notes)
          case $TAG in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" "${files[@]}"
