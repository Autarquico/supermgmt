name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, BlueOak-1.0.0, Python-2.0, CC0-1.0
          # Go's own x/ modules and google.golang.org/protobuf are BSD-3-Clause plus the Go patent grant
          # (LicenseRef-scancode-google-patent-license-golang). opencontainers/go-digest is Apache-2.0 code;
          # its CC-BY-SA-4.0 covers documentation only. modelcontextprotocol/go-sdk code is Apache-2.0 or
          # MIT (relicensing transition); its CC-BY-4.0 covers documentation only.
          # The website's self-hosted fonts (@fontsource packages) are SIL OFL-1.1: free to embed and
          # redistribute. They are exempted by package, so OFL-1.1 stays out of allow-licenses; the
          # licence texts ship with the site and are listed in docs/dependencies.md.
          # sharp's prebuilt libvips binaries (@img/*, LGPL-3.0-or-later) are optional dependencies of the
          # website's build tool, used only for image optimisation the site does not use; they run at build
          # time and nothing of them is shipped in the site or the binary. They are exempted by package.
          allow-dependencies-licenses: pkg:golang/golang.org/x/sys, pkg:golang/golang.org/x/crypto, pkg:golang/golang.org/x/sync, pkg:golang/golang.org/x/oauth2, pkg:golang/golang.org/x/net, pkg:golang/golang.org/x/term, pkg:golang/google.golang.org/protobuf, pkg:golang/github.com/opencontainers/go-digest, pkg:golang/golang.org/x/time, pkg:golang/github.com/modelcontextprotocol/go-sdk, pkg:npm/%40fontsource/instrument-serif, pkg:npm/%40fontsource/geist-sans, pkg:npm/%40fontsource/geist-mono, pkg:npm/%40fontsource-variable/geist, pkg:npm/%40fontsource-variable/geist-mono, pkg:npm/%40img/sharp-libvips-darwin-arm64, pkg:npm/%40img/sharp-libvips-darwin-x64, pkg:npm/%40img/sharp-libvips-linux-arm, pkg:npm/%40img/sharp-libvips-linux-arm64, pkg:npm/%40img/sharp-libvips-linux-ppc64, pkg:npm/%40img/sharp-libvips-linux-riscv64, pkg:npm/%40img/sharp-libvips-linux-s390x, pkg:npm/%40img/sharp-libvips-linux-x64, pkg:npm/%40img/sharp-libvips-linuxmusl-arm64, pkg:npm/%40img/sharp-libvips-linuxmusl-x64, pkg:npm/%40img/sharp-wasm32, pkg:npm/%40img/sharp-win32-arm64, pkg:npm/%40img/sharp-win32-ia32, pkg:npm/%40img/sharp-win32-x64
