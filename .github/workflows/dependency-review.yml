name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0
          # Go's own x/ modules are BSD-3-Clause plus the Go patent grant (LicenseRef-scancode-google-patent-license-golang).
          allow-dependencies-licenses: pkg:golang/golang.org/x/sys, pkg:golang/golang.org/x/crypto, pkg:golang/golang.org/x/sync
