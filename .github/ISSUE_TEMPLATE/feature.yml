name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Redact secrets and hostnames** from anything you paste here.
        Security vulnerabilities go through private vulnerability reporting, not this form.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: version
    attributes:
      label: sm version
      description: Output of `sm version`, if relevant
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture and install mode, if relevant
