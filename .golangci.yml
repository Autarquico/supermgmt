version: "2"

run:
  timeout: 5m
  build-tags:
    - fixtures

linters:
  default: none
  enable:
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        domain-is-pure:
          files:
            - "**/internal/domain/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
        policy-is-storage-free:
          files:
            - "**/internal/policy/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/database
              desc: policy must not depend on persistence
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: policy must not depend on the job engine
        sql-stays-in-storage:
          files:
            - "**/*.go"
            - "!**/internal/database/**"
            - "!**/internal/jobs/**"
            - "!**/migrations/**"
          deny:
            - pkg: database/sql
              desc: only internal/database, internal/jobs and migrations may use database/sql
            - pkg: modernc.org/sqlite
              desc: only internal/database, internal/jobs and migrations may import the SQLite driver
        wire-is-pure:
          files:
            - "**/internal/api/wire/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
        tui-and-client-are-thin:
          files:
            - "**/internal/tui/**"
            - "**/internal/client/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/app
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/database
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/daemon
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: tui and client never open SSH sessions themselves
            - pkg: github.com/autarquico/supermgmt/internal/runtimes
              desc: tui and client never run runtime adapters
            - pkg: github.com/autarquico/supermgmt/internal/providers
              desc: tui and client never talk to providers
        api-does-not-reach-nodes:
          files:
            - "**/internal/api/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/runtimes
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/providers
              desc: api reaches nodes only through app services
        cli-uses-the-client:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/app
              desc: cli talks to the daemon through internal/client; offline commands use database, config and policy
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: cli talks to the daemon through internal/client; offline commands use database, config and policy
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: cli never opens SSH sessions itself
        cmd-only-imports-cli:
          files:
            - "**/cmd/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/cli
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: inject a domain.Clock instead of calling time.Now
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write through an injected io.Writer; fmt.Print is allowed only in internal/cli
      analyze-types: true
    importas:
      alias:
        - pkg: github.com/autarquico/supermgmt/internal/errors
          alias: smerr
      no-unaliased: true
    exhaustive:
      default-signifies-exhaustive: false
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - forbidigo
        text: fmt\.Print
      - path: internal/domain/(clock|clock_test|id_test)\.go
        linters:
          - forbidigo
        text: time\.Now
      # Reason/enum identifiers such as CREDENTIAL_REVOKED are not credentials.
      - path: internal/(errors/reason|domain/enum)\.go
        linters:
          - gosec
        text: G101
      - path: internal/cli/
        linters:
          - forbidigo
        text: fmt\.Print
      # The fixture helper drives the docker CLI with arguments it builds itself.
      - path: test/fixtures/
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/autarquico/supermgmt
