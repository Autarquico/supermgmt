version: "2"

run:
  timeout: 5m
  build-tags:
    - fixtures

linters:
  default: none
  enable:
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        domain-is-pure:
          files:
            - "**/internal/domain/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
        policy-is-storage-free:
          files:
            - "**/internal/policy/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/database
              desc: policy must not depend on persistence
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: policy must not depend on the job engine
        sql-stays-in-storage:
          files:
            - "**/*.go"
            - "!**/internal/database/**"
            - "!**/internal/jobs/**"
            - "!**/migrations/**"
          deny:
            - pkg: database/sql
              desc: only internal/database, internal/jobs and migrations may use database/sql
            - pkg: modernc.org/sqlite
              desc: only internal/database, internal/jobs and migrations may import the SQLite driver
        wire-is-pure:
          files:
            - "**/internal/api/wire/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
        tui-and-client-are-thin:
          files:
            - "**/internal/tui/**"
            - "**/internal/client/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/app
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/database
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/daemon
              desc: tui and client talk to the daemon through the API only
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: tui and client never open SSH sessions themselves
            - pkg: github.com/autarquico/supermgmt/internal/runtimes
              desc: tui and client never run runtime adapters
            - pkg: github.com/autarquico/supermgmt/internal/providers
              desc: tui and client never talk to providers
            - pkg: github.com/autarquico/supermgmt/internal/auth
              desc: tui and client present tokens; they never mint or verify them
            - pkg: github.com/autarquico/supermgmt/internal/secrets
              desc: tui and client never hold master keys
            - pkg: github.com/autarquico/supermgmt/internal/backup
              desc: tui and client reach backups through the API
            - pkg: github.com/autarquico/supermgmt/internal/installer
              desc: tui and client do not install
        api-does-not-reach-nodes:
          files:
            - "**/internal/api/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/runtimes
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/providers/local
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/providers/ssh
              desc: api reaches nodes only through app services
            - pkg: github.com/autarquico/supermgmt/internal/providers/proxmox
              desc: api reaches nodes only through app services
        cli-uses-the-client:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/app
              desc: cli talks to the daemon through internal/client; offline commands use database, config and policy
            - pkg: github.com/autarquico/supermgmt/internal/jobs
              desc: cli talks to the daemon through internal/client; offline commands use database, config and policy
            - pkg: github.com/autarquico/supermgmt/internal/transport
              desc: cli never opens SSH sessions itself
        netguard-is-stdlib:
          files:
            - "**/internal/netguard/**"
          list-mode: strict
          allow:
            - $gostd
        installer-shells-out:
          files:
            - "**/internal/installer/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/database
              desc: the installer runs `sm` subcommands for offline database work (ADR-0019, ADR-0020)
            - pkg: github.com/autarquico/supermgmt/internal/app
              desc: the installer runs `sm` subcommands for offline database work (ADR-0019, ADR-0020)
        proxmox-provider-is-thin:
          files:
            - "**/internal/providers/proxmox/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/providers/proxmox
            - github.com/autarquico/supermgmt/internal/netguard
            - github.com/autarquico/supermgmt/internal/config
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
            - github.com/autarquico/supermgmt/internal/audit
        pve-fake-stays-in-tests:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/internal/providers/proxmox/pvefake/**"
            - "!**/test/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/providers/proxmox/pvefake
              desc: the fake PVE API is for tests only (ADR-0023)
        compose-pipeline-is-closed:
          files:
            - "**/internal/deployments/compose/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/compose-spec/compose-go/v2
            - go.yaml.in/yaml/v3
            - github.com/autarquico/supermgmt/internal/deployments/compose
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
            - github.com/autarquico/supermgmt/internal/audit
        compose-go-stays-in-the-pipeline:
          files:
            - "**/*.go"
            - "!**/internal/deployments/compose/**"
          deny:
            - pkg: github.com/compose-spec/compose-go
              desc: only internal/deployments/compose loads Compose files (ADR-0006)
        github-provider-is-thin:
          files:
            - "**/internal/providers/github/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/providers/github
            - github.com/autarquico/supermgmt/internal/netguard
            - github.com/autarquico/supermgmt/internal/config
            - github.com/autarquico/supermgmt/internal/domain
            - github.com/autarquico/supermgmt/internal/errors
            - github.com/autarquico/supermgmt/internal/audit
            - github.com/sigstore/sigstore-go
            - github.com/sigstore/protobuf-specs
            - github.com/theupdateframework/go-tuf/v2
            - github.com/secure-systems-lab/go-securesystemslib
            - github.com/go-jose/go-jose/v4
        sigstore-stays-in-the-github-provider:
          files:
            - "**/*.go"
            - "!**/internal/providers/github/**"
          deny:
            - pkg: github.com/sigstore/sigstore-go
              desc: only internal/providers/github verifies attestations (ADR-0028)
            - pkg: github.com/sigstore/protobuf-specs
              desc: only internal/providers/github verifies attestations (ADR-0028)
            - pkg: github.com/theupdateframework/go-tuf/v2
              desc: only internal/providers/github refreshes the trusted roots (ADR-0028)
        sigstore-test-ca-stays-in-tests:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/internal/providers/github/ghfake/**"
            - "!**/test/**"
          deny:
            - pkg: github.com/sigstore/sigstore-go/pkg/testing
              desc: the virtual Sigstore signs test attestations only (ADR-0028)
        github-fake-stays-in-tests:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/internal/providers/github/ghfake/**"
            - "!**/test/**"
          deny:
            - pkg: github.com/autarquico/supermgmt/internal/providers/github/ghfake
              desc: the fake GitHub API is for tests only (ADR-0028)
        oidc-libraries-stay-in-auth-oidc:
          files:
            - "**/*.go"
            - "!**/internal/auth/oidc/**"
          deny:
            - pkg: github.com/coreos/go-oidc/v3
              desc: only internal/auth/oidc talks to the IdP (ADR-0018)
            - pkg: golang.org/x/oauth2
              desc: only internal/auth/oidc talks to the IdP (ADR-0018)
        zstd-stays-in-backup:
          files:
            - "**/*.go"
            - "!**/internal/backup/**"
          deny:
            - pkg: github.com/klauspost/compress
              desc: only internal/backup reads and writes archives (ADR-0020)
        cmd-only-imports-cli:
          files:
            - "**/cmd/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/autarquico/supermgmt/internal/cli
    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: inject a domain.Clock instead of calling time.Now
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write through an injected io.Writer; fmt.Print is allowed only in internal/cli
      analyze-types: true
    importas:
      alias:
        - pkg: github.com/autarquico/supermgmt/internal/errors
          alias: smerr
      no-unaliased: true
    exhaustive:
      default-signifies-exhaustive: false
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - forbidigo
        text: fmt\.Print
      - path: internal/domain/(clock|clock_test|id_test)\.go
        linters:
          - forbidigo
        text: time\.Now
      # Reason/enum identifiers such as CREDENTIAL_REVOKED are not credentials.
      - path: internal/(errors/reason|domain/enum)\.go
        linters:
          - gosec
        text: G101
      - path: internal/cli/
        linters:
          - forbidigo
        text: fmt\.Print
      # The API writes JSON envelopes as application/json over the owner-only
      # Unix socket; G705's HTML-XSS taint analysis does not apply and is flaky here.
      - path: internal/api/respond\.go
        linters:
          - gosec
        text: G705
      # A socket fd from RawConn.Control always fits an int (G115 fires only on some platforms).
      - path: internal/(api|client)/peer_linux\.go
        linters:
          - gosec
        text: G115
      # The fixture helper drives the docker CLI with arguments it builds itself.
      - path: test/fixtures/
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/autarquico/supermgmt
