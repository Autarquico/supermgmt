        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of MCP clients.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfMCPClient'}}}]}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: registerMCPClient
      summary: Register an MCP client.
      description: Creates the client's identity with no role bindings. A local client then collects its token with the token route.
      tags: [mcp]
      x-supermgmt-route: action:mcp_client.register
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterMCPClientRequest'}
      responses:
        '200':
          description: Registered at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfMCPClient'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfMCPClient'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/mcp/clients/{id}:
    delete:
      operationId: deleteMCPClient
      summary: Delete an MCP client.
      description: Revokes its token and OAuth access tokens, disables its identity and removes its role bindings. The row is kept.
      tags: [mcp]
      x-supermgmt-route: action:mcp_client.delete
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Deleted at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfMCPClient'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfMCPClient'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/mcp/clients/{id}/token:
    post:
      operationId: issueMCPClientToken
      summary: Issue a local MCP client's token (value shown once).
      description: Allowed once, only to the registrant, only while the client is pending_token and within 24 hours of approval. Rejects a request carrying `Idempotency-Key`.
      tags: [mcp]
      x-supermgmt-route: action:mcp_client.issue_token
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueMCPTokenRequest'}
      responses:
        '201':
          description: The client and its token.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/MCPTokenIssued'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a GitHub webhook delivery.
      description: >-
        Server mode, HTTPS only; local mode polls CI instead. Carries no bearer token: the caller is
        authenticated by the HMAC-SHA256 of the raw body under a GitHub provider's webhook secret. A delivery
        only triggers a re-evaluation of the deployments waiting on a commit; the GitHub API stays the source
        of truth. A bad signature is UNAUTHENTICATED whatever the reason. Takes no `Idempotency-Key`; a repeated
        `X-GitHub-Delivery` is acknowledged as `duplicate`.
      tags: [deployments]
      x-supermgmt-route: exempt:webhook
      security: []
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, description: 'sha256=<hex HMAC of the body>.', schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, description: 'Delivery id: at most 128 printable bytes.', schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: X-GitHub-Event, in: header, required: false, description: The GitHub event name., schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: The GitHub event payload.}
      responses:
        '200':
          description: The delivery was verified.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/WebhookAck'}}}]}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session token or an API token. Refused on the local-mode Unix socket, where the peer's credentials identify the caller.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource id.
      schema: {$ref: '#/components/schemas/ID'}
    Sid:
      name: sid
      in: path
      required: true
      description: Session id.
      schema: {$ref: '#/components/schemas/ID'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Makes a retry replay the first answer for 24 hours; reusing it with a different request is IDEMPOTENCY_MISMATCH.
      schema: {type: string, minLength: 1}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The spec_revision the caller read.
      schema: {type: string}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous page.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; 0 or absent means 50.
      schema: {type: integer, minimum: 0, maximum: 500}
  requestBodies:
    CreatePlan:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CreatePlanRequest'}
    PlanHash:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlanHashRequest'}
    Decision:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DecisionRequest'}
  responses:
    Error:
      description: |
        A failure. `error.code` is stable; `error.details.reason` carries the reason enum (spec section 38).
        Statuses follow the code: 400 INVALID_ARGUMENT, 401 UNAUTHENTICATED, 403 POLICY_DENIED and
        APPROVAL_REQUIRED, 404 NOT_FOUND, 409 CONFLICT, 422 CAPABILITY_UNAVAILABLE, 502 NODE_UNREACHABLE,
        504 TIMEOUT, 500 otherwise.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Health:
      description: Probe answer.
      content:
        application/json:
          schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Health'}}}]}
    Empty:
      description: Done; the data object is empty.
      content:
        application/json:
          schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Empty'}}}]}
    Submission:
      description: The job created and why it is queued or awaiting approval.
      content:
        application/json:
          schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Submission'}}}]}
    Deployment:
      description: The deployment.
      content:
        application/json:
          schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Deployment'}}}]}
    Job:
      description: The job.
      content:
        application/json:
          schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Job'}}}]}
  schemas:
    ID:
      type: string
      description: A UUIDv7.
    Timestamp:
      type: string
      format: date-time
    Empty:
      type: object
      description: No fields.
      additionalProperties: false
    Envelope:
      type: object
      description: Wraps every success.
      required: [data, meta]
      properties:
        data: {description: The payload.}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      properties:
        correlation_id: {type: string}
    ErrorEnvelope:
      type: object
      description: Wraps every failure.
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      required: [code, message, correlation_id, details]
      properties:
        code:
          type: string
          enum: [INVALID_ARGUMENT, NOT_FOUND, CONFLICT, UNAUTHENTICATED, POLICY_DENIED, APPROVAL_REQUIRED, CAPABILITY_UNAVAILABLE, NODE_UNREACHABLE, SSH_HOST_KEY_MISMATCH, PROVIDER_ERROR, CI_NOT_PASSED, ARTIFACT_NOT_IMMUTABLE, DEPLOYMENT_FAILED, ROLLBACK_FAILED, TIMEOUT, INTERNAL]
        message: {type: string}
        correlation_id: {type: string}
        details: {type: object, additionalProperties: true}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string}
    Me:
      type: object
      required: [identity_id, actor_type, display_name, credential, roles, instance_mode]
      properties:
        identity_id: {$ref: '#/components/schemas/ID'}
        actor_type: {type: string}
        display_name: {type: string}
        credential: {type: string}
        roles: {type: array, items: {type: string}}
        instance_mode: {type: string}
    SSHKey:
      type: object
      required: [ref, version, authorized_key, fingerprint_sha256]
      properties:
        ref: {type: string}
        version: {type: integer}
        authorized_key: {type: string}
        fingerprint_sha256: {type: string}
    Provider:
      type: object
      required: [id, type, name, origin, status, spec_revision, last_sync_at, last_error]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        type: {type: string}
        name: {type: string}
        origin: {type: string}
        status: {type: string}
        spec_revision: {type: integer, format: int64}
        last_sync_at: {type: [string, 'null'], format: date-time}
        last_error: {type: string, description: Why the latest sync failed; empty when it did not.}
    CreateProviderRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [local]}
    Node:
      type: object
      required: [id, name, kind, provider_id, provider, origin, environment, management_state, reachability, endpoint, credential_ref, admin_credential_ref, os, arch, tags, capabilities, addresses, connection, metrics, setup, proxmox, stale, spec_revision, last_seen_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {type: string}
        kind: {type: string}
        provider_id: {$ref: '#/components/schemas/ID'}
        provider: {type: string}
        origin: {type: string}
        environment: {type: string}
        management_state: {type: string}
        reachability: {type: string}
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        credential_ref: {type: string}
        admin_credential_ref: {type: string}
        os: {type: string}
        arch: {type: string}
        tags: {type: array, items: {type: string}}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
        addresses: {type: array, items: {$ref: '#/components/schemas/Address'}}
        connection: {$ref: '#/components/schemas/Connection'}
        metrics: {oneOf: [{$ref: '#/components/schemas/Metrics'}, {type: 'null'}]}
        setup: {oneOf: [{$ref: '#/components/schemas/Setup'}, {type: 'null'}]}
        proxmox: {oneOf: [{$ref: '#/components/schemas/ProxmoxGuest'}, {type: 'null'}]}
        stale: {type: boolean}
        spec_revision: {type: integer, format: int64}
        last_seen_at: {type: [string, 'null'], format: date-time}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ProxmoxGuest:
      type: object
      description: The Proxmox view of a node (ADR-0024); for a cluster member vmid is 0 and type is "node".
      required: [pve_node, vmid, type, status, template, inaccessible, absent]
      properties:
        pve_node: {type: string}
        vmid: {type: integer}
        type: {type: string, enum: [node, qemu, lxc]}
        status: {type: string}
        template: {type: boolean}
        inaccessible: {type: boolean}
        absent: {type: boolean}
    Endpoint:
      type: object
      required: [host, port, user, admin_user, host_public_key, host_key_fingerprint_sha256]
      properties:
        host: {type: string}
        port: {type: integer}
        user: {type: string}
        admin_user: {type: string}
        host_public_key: {type: string}
        host_key_fingerprint_sha256: {type: string}
        transport: {type: string, enum: [direct, cloudflare]}
        tunnel_hostname: {type: string}
    Capability:
      type: object
      required: [name, available, checked_at]
      properties:
        name: {type: string}
        available: {type: boolean}
        checked_at: {$ref: '#/components/schemas/Timestamp'}
    Address:
      type: object
      required: [address, family, scope, preferred]
      properties:
        address: {type: string}
        family: {type: string}
        scope: {type: string}
        preferred: {type: boolean}
    Connection:
      type: object
      required: [state, last_error, next_dial_at]
      properties:
        state: {type: string, enum: [connected, idle, backoff, unknown]}
        last_error: {type: string}
        next_dial_at: {type: [string, 'null'], format: date-time}
    Metrics:
      type: object
      required: [observed_at, cpu_percent, memory_used_bytes, memory_total_bytes, disk_used_bytes, disk_total_bytes, uptime_seconds]
      properties:
        observed_at: {$ref: '#/components/schemas/Timestamp'}
        cpu_percent: {type: number}
        memory_used_bytes: {type: integer, format: int64}
        memory_total_bytes: {type: integer, format: int64}
        disk_used_bytes: {type: integer, format: int64}
        disk_total_bytes: {type: integer, format: int64}
        uptime_seconds: {type: integer, format: int64}
    Setup:
      type: object
      required: [setup_version, logs_mode, docker_access, units, key_fingerprint, proxmox]
      properties:
        setup_version: {type: integer}
        logs_mode: {type: string}
        docker_access: {type: boolean}
        units: {type: array, items: {$ref: '#/components/schemas/UnitGrant'}}
        key_fingerprint: {type: string}
        proxmox: {type: boolean}
    UnitGrant:
      type: object
      required: [unit, verbs]
      properties:
        unit: {type: string}
        verbs: {type: array, items: {type: string}}
    ScanHostKeyRequest:
      type: object
      required: [host, port]
      properties:
        host: {type: string}
        port: {type: integer}
    HostKey:
      type: object
      required: [authorized_key, type, fingerprint_sha256]
      properties:
        authorized_key: {type: string}
        type: {type: string}
        fingerprint_sha256: {type: string}
    AddSSHNodeRequest:
      type: object
      required: [name, host, port, user, admin_user, host_public_key, credential_ref, admin_credential_ref, environment, tags]
      properties:
        name: {type: string}
        host: {type: string}
        port: {type: integer}
        user: {type: string}
        admin_user: {type: string}
        host_public_key: {type: string, description: The key the user confirmed from a scan.}
        credential_ref: {type: string}
        admin_credential_ref: {type: string}
        environment: {type: string}
        tags: {type: array, items: {type: string}}
    NodePatch:
      type: object
      description: Absent fields are unchanged.
      properties:
        name: {type: string}
        environment: {type: string}
        tags: {type: array, items: {type: string}}
        admin_user: {type: string}
        admin_credential_ref: {type: string}
        host_public_key: {type: string}
    ConnectInfo:
      type: object
      required: [node_id, host, port, user, host_public_key, host_key_alias]
      properties:
        node_id: {$ref: '#/components/schemas/ID'}
        host: {type: string}
        port: {type: integer}
        user: {type: string}
        host_public_key: {type: string}
        host_key_alias: {type: string}
        transport: {type: string, enum: [direct, cloudflare]}
        tunnel_hostname: {type: string}
    OpenSessionRequest:
      type: object
      required: [tool]
      properties:
        tool: {type: string, enum: [shell, lazydocker, btop, tmux]}
    Session:
      type: object
      required: [id, node_id, tool, state, exit_code, end_reason, created_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        node_id: {$ref: '#/components/schemas/ID'}
        tool: {type: string, enum: [shell, lazydocker, btop, tmux]}
        state: {type: string, enum: [issued, ended, abandoned]}
        exit_code: {type: [integer, 'null']}
        end_reason: {type: [string, 'null'], enum: [exited, launch_failed, abandoned, null]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {type: [string, 'null'], format: date-time}
    SessionOpened:
      type: object
      required: [session, connect_info]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        connect_info: {$ref: '#/components/schemas/ConnectInfo'}
    EndSessionRequest:
      type: object
      required: [reason, exit_code]
      properties:
        reason: {type: string, enum: [exited, launch_failed]}
        exit_code: {type: [integer, 'null']}
    Service:
      type: object
      required: [id, node_id, node, runtime_type, kind, native_id, name, status, health, metadata, actions, spec_revision, last_seen_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        node_id: {$ref: '#/components/schemas/ID'}
        node: {type: string}
        runtime_type: {type: string}
        kind: {type: string}
        native_id: {type: string}
        name: {type: string}
        status: {type: string}
        health: {type: string}
        metadata: {type: object, additionalProperties: true}
        actions: {type: array, items: {type: string}}
        spec_revision: {type: integer, format: int64}
        last_seen_at: {type: [string, 'null'], format: date-time}
    LogChunk:
      type: object
      required: [service_id, lines, truncated, collected_at]
      properties:
        service_id: {$ref: '#/components/schemas/ID'}
        lines: {type: array, items: {type: string}}
        truncated: {type: boolean}
        collected_at: {$ref: '#/components/schemas/Timestamp'}
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type: {type: string}
        id: {$ref: '#/components/schemas/ID'}
    CreatePlanRequest:
      type: object
      required: [action, targets, parameters]
      properties:
        action: {type: string, description: A catalog action id.}
        targets: {type: array, minItems: 1, maxItems: 1, items: {$ref: '#/components/schemas/ResourceRef'}}
        parameters: {type: object, additionalProperties: true}
    Policy:
      type: object
      required: [decision, approval_required, quorum, reason]
      properties:
        decision: {type: string}
        approval_required: {type: boolean}
        quorum: {type: integer}
        reason: {type: string}
    CreatedPlan:
      type: object
      required: [plan_id, plan, plan_hash, expires_at, policy]
      properties:
        plan_id: {$ref: '#/components/schemas/ID'}
        plan: {type: object, description: The canonical plan document whose SHA-256 is plan_hash., additionalProperties: true}
        plan_hash: {type: string}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        policy: {$ref: '#/components/schemas/Policy'}
    PlanHashRequest:
      type: object
      required: [plan_hash]
      properties:
        plan_hash: {type: string}
    Submission:
      type: object
      required: [job, policy]
      properties:
        job: {$ref: '#/components/schemas/Job'}
        policy: {$ref: '#/components/schemas/Policy'}
    DecisionRequest:
      type: object
      required: [plan_hash, reason]
      properties:
        plan_hash: {type: string}
        reason: {type: string, description: Required to reject.}
    ResolveRequest:
      type: object
      required: [plan_hash, outcome, note, assume_quiescent]
      properties:
        plan_hash: {type: string}
        outcome: {type: string, enum: [succeeded, failed, rollback_failed]}
        note: {type: string}
        assume_quiescent: {type: boolean, description: Required when the node is unreachable; audited.}
    Job:
      type: object
      required: [id, type, resource, actor_id, state, risk, retry_class, plan_id, plan_hash, attempts, max_attempts, created_at, scheduled_at, started_at, finished_at, error]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        type: {type: string}
        resource: {$ref: '#/components/schemas/ResourceRef'}
        actor_id: {$ref: '#/components/schemas/ID'}
        state: {type: string}
        risk: {type: string}
        retry_class: {type: string}
        plan_id: {oneOf: [{$ref: '#/components/schemas/ID'}, {type: 'null'}]}
        plan_hash: {type: string}
        attempts: {type: integer}
        max_attempts: {type: integer}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        scheduled_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        error: {oneOf: [{$ref: '#/components/schemas/Failure'}, {type: 'null'}]}
    Failure:
      type: object
      required: [code, reason, message]
      properties:
        code: {type: string}
        reason: {type: string}
        message: {type: string}
    JobDetail:
      type: object
      required: [job, intents]
      properties:
        job: {$ref: '#/components/schemas/Job'}
        intents: {type: array, items: {$ref: '#/components/schemas/Intent'}}
    Intent:
      type: object
      required: [id, step, state, operation, target, pre_state, deadline_at, dispatched_at, completed_at, outcome, evidence]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        step: {type: string}
        state: {type: string}
        operation: {type: string}
        target: {type: string}
        pre_state: {description: What the reconciler saw before dispatch; any JSON.}
        deadline_at: {$ref: '#/components/schemas/Timestamp'}
        dispatched_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        outcome: {type: string}
        evidence: {description: Any JSON.}
    Approval:
      type: object
      required: [job, plan, environments, quorum, approvals, expires_at]
      properties:
        job: {$ref: '#/components/schemas/Job'}
        plan: {type: object, additionalProperties: true}
        environments: {type: array, items: {type: string}}
        quorum: {type: integer}
        approvals: {type: integer}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    Event:
      type: object
      required: [event_id, seq, timestamp, actor, source, action, resource, correlation_id, severity, result, data]
      properties:
        event_id: {$ref: '#/components/schemas/ID'}
        seq: {type: integer, format: int64}
        timestamp: {$ref: '#/components/schemas/Timestamp'}
        actor: {$ref: '#/components/schemas/Actor'}
        source: {type: string}
        action: {type: string}
        resource: {$ref: '#/components/schemas/ResourceRef'}
        correlation_id: {type: string}
        severity: {type: string}
        result: {type: string}
        data: {type: object, additionalProperties: true}
    Actor:
      type: object
      required: [type, id]
      properties:
        type: {type: string}
        id: {$ref: '#/components/schemas/ID'}
    OIDCStartRequest:
      type: object
      required: [redirect_uri, code_challenge]
      properties:
        redirect_uri: {type: string, description: 'http://127.0.0.1:<port>/callback (RFC 8252).'}
        code_challenge: {type: string, description: PKCE S256 challenge.}
    OIDCStart:
      type: object
      required: [authorization_url, state]
      properties:
        authorization_url: {type: string}
        state: {type: string}
    OIDCExchangeRequest:
      type: object
      required: [code, state, code_verifier, client]
      properties:
        code: {type: string}
        state: {type: string}
        code_verifier: {type: string}
        client: {type: string}
    LoginSession:
      type: object
      required: [session_id, identity_id, token, expires_at]
      properties:
        session_id: {$ref: '#/components/schemas/ID'}
        identity_id: {$ref: '#/components/schemas/ID'}
        token: {type: string, description: Shown once.}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    DeviceStart:
      type: object
      required: [transaction_id, user_code, verification_uri, interval_seconds, expires_at]
      properties:
        transaction_id: {type: string}
        user_code: {type: string}
        verification_uri: {type: string}
        verification_uri_complete: {type: string}
        interval_seconds: {type: integer}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    DevicePollRequest:
      type: object
      required: [transaction_id, client]
      properties:
        transaction_id: {type: string}
        client: {type: string}
    DevicePoll:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, slow_down, complete]}
        session:
          description: Set only with status complete, exactly once per transaction; a later poll is a CONFLICT.
          $ref: '#/components/schemas/LoginSession'
    BootstrapRequest:
      type: object
      required: [code]
      properties:
        code: {type: string}
        display_name: {type: string, description: Names the admin identity to create when OIDC is not configured.}
    Bootstrapped:
      type: object
      required: [identity_id]
      properties:
        identity_id: {$ref: '#/components/schemas/ID'}
        session:
          description: Set only when the exchange created the identity (no OIDC).
          $ref: '#/components/schemas/LoginSession'
        api_token:
          description: Set only when the exchange created the identity (no OIDC).
          $ref: '#/components/schemas/TokenIssued'
    Token:
      type: object
