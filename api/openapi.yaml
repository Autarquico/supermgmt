      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: All targets of the app; the page has no cursor.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfAppTarget'}}}]}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAppTarget
      summary: Bind an application to an environment and a node.
      description: The Compose project is derived, `sm-<app>-<environment>`.
      tags: [apps]
      x-supermgmt-route: action:app_target.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAppTargetRequest'}
      responses:
        '201':
          description: Created at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfAppTarget'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfAppTarget'}}}]}
        default: {$ref: '#/components/responses/Error'}
