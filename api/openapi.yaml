openapi: 3.1.0
info:
  title: SuperMgmt API
  version: 1.0.0
  summary: The /api/v1 contract of the SuperMgmt daemon.
  description: |
    Hand-written and authoritative (spec section 23, ADR-0012). Every operation carries
    `x-supermgmt-route`, exactly one of `action:<catalog id>`, `exempt:auth`, `exempt:health`,
    `exempt:self` or `exempt:webhook`. `make api-check` fails when this document and the Go route table differ.

    Every success is `{"data": ..., "meta": {...}}`; every failure is `{"error": {...}}`.
    Over HTTPS callers send `Authorization: Bearer <token>`. On the local-mode Unix socket the
    caller is identified by its peer credentials and `Authorization` is refused. The four
    admin-socket routes are outside this document (ADR-0012).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: SuperMgmt maintainers
    url: https://github.com/autarquico/supermgmt
servers:
  - url: https://{host}
    description: Server mode over HTTPS. Local mode serves the same routes on a Unix socket.
    variables:
      host:
        default: supermgmt.example.com
        description: Host (and port) the daemon listens on.
security:
  - bearer: []
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: identity
    description: The caller's own connection.
  - name: auth
    description: Login and bootstrap. Not catalog actions.
  - name: tokens
    description: API tokens.
  - name: plans
    description: Plans and their submission.
  - name: jobs
    description: Jobs, approvals and governance.
  - name: providers
    description: Providers.
  - name: nodes
    description: Nodes and interactive sessions.
  - name: services
    description: Runtime-native services.
  - name: events
    description: The audit event log and its stream.
  - name: keys
    description: Master key, instance SSH identity and secrets.
  - name: backups
    description: Backups.
  - name: enrollment
    description: Join tokens and node enrollment.
  - name: apps
    description: Applications and their environment targets.
  - name: mcp
    description: MCP clients and their tokens.
  - name: deployments
    description: Deployments, rollbacks and the GitHub webhook.
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe.
      tags: [health]
      x-supermgmt-route: exempt:health
      security: []
      responses:
        '200': {$ref: '#/components/responses/Health'}
        default: {$ref: '#/components/responses/Error'}
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe.
      tags: [health]
      x-supermgmt-route: exempt:health
      security: []
      responses:
        '200': {$ref: '#/components/responses/Health'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: getMe
      summary: The caller as the daemon authenticated it.
      tags: [identity]
      x-supermgmt-route: exempt:self
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Me'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/presence:
    get:
      operationId: getPresence
      summary: Hold the connection open to tell the daemon someone is watching.
      description: Answers once with status `connected`, then stays open until the client goes or the server shuts down.
      tags: [identity]
      x-supermgmt-route: exempt:self
      responses:
        '200': {$ref: '#/components/responses/Health'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/ssh-key:
    get:
      operationId: getSSHKey
      summary: The public half of the instance SSH identity.
      tags: [keys]
      x-supermgmt-route: action:config.read
      responses:
        '200':
          description: The public key.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/SSHKey'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/ssh-key/rotate:
    post:
      operationId: rotateSSHKey
      summary: Rotate the instance SSH identity.
      tags: [keys]
      x-supermgmt-route: action:secret.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rotated at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfSSHKey'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfSSHKey'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events:
    get:
      operationId: listEvents
      summary: One page of the audit event log.
      tags: [events]
      x-supermgmt-route: action:event.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: resource_type, in: query, required: false, description: Only events about this resource type., schema: {type: string}}
        - {name: resource_id, in: query, required: false, description: Only events about this resource., schema: {$ref: '#/components/schemas/ID'}}
        - {name: after_seq, in: query, required: false, description: Only events with a greater seq., schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfEvent'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/events/stream:
    get:
      operationId: streamEvents
      summary: The audit log as server-sent events.
      description: |
        One frame per event, `id: <seq>`, `data:` an Event as JSON. Resumes after `Last-Event-ID`,
        else after `after_seq`, else from the end of the log. The credential and `event.read` are
        re-evaluated while the stream is open.
      tags: [events]
      x-supermgmt-route: action:event.read
      parameters:
        - {name: Last-Event-ID, in: header, required: false, description: Resume after this seq., schema: {type: integer, format: int64}}
        - {name: after_seq, in: query, required: false, description: Resume after this seq when Last-Event-ID is absent., schema: {type: integer, format: int64, minimum: 0}}
        - {name: resource_type, in: query, required: false, description: Only events about this resource type., schema: {type: string}}
        - {name: resource_id, in: query, required: false, description: Only events about this resource., schema: {$ref: '#/components/schemas/ID'}}
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: {type: string, description: Server-sent events whose data is an Event as JSON.}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plans:
    post:
      operationId: createPlan
      summary: Create a plan for one action on one target.
      tags: [plans]
      x-supermgmt-route: action:plan.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/CreatePlan'}
      responses:
        '201':
          description: The plan and its policy verdict.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/CreatedPlan'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plans/{id}:
    get:
      operationId: getPlan
      summary: A plan with its canonical document and hash.
      tags: [plans]
      x-supermgmt-route: action:plan.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/CreatedPlan'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/plans/{id}/submit:
    post:
      operationId: submitPlan
      summary: Submit a plan as a job.
      tags: [plans]
      x-supermgmt-route: action:plan.create
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/PlanHash'}
      responses:
        '202': {$ref: '#/components/responses/Submission'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: Jobs awaiting approval with what an approver must see.
      tags: [jobs]
      x-supermgmt-route: action:job.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of approvals.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfApproval'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: One page of jobs.
      tags: [jobs]
      x-supermgmt-route: action:job.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: state, in: query, required: false, description: Only jobs in these states; repeat for several., explode: true, schema: {type: array, items: {type: string}}}
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfJob'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: A job and its operation intents.
      tags: [jobs]
      x-supermgmt-route: action:job.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/JobDetail'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/approve:
    post:
      operationId: approveJob
      summary: Approve a job bound to a plan hash.
      tags: [jobs]
      x-supermgmt-route: action:approval.grant
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/reject:
    post:
      operationId: rejectJob
      summary: Reject a job; a reason is required.
      tags: [jobs]
      x-supermgmt-route: action:approval.reject
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a job bound to a plan hash.
      tags: [jobs]
      x-supermgmt-route: action:job.cancel
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: {$ref: '#/components/requestBodies/PlanHash'}
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/resolve:
    post:
      operationId: resolveJob
      summary: Resolve an interrupted job by hand.
      tags: [jobs]
      x-supermgmt-route: action:job.resolve
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveRequest'}
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: The registered providers.
      tags: [providers]
      x-supermgmt-route: action:provider.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of providers.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfProvider'}}}]}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createProvider
      summary: Register a provider; `local` or `github`.
      description: The body is discriminated by `type`. A GitHub provider holds `secret://` references, never token values.
      tags: [providers]
      x-supermgmt-route: action:provider.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateProviderRequest'
                - $ref: '#/components/schemas/CreateGitHubProviderRequest'
              discriminator:
                propertyName: type
                mapping:
                  local: '#/components/schemas/CreateProviderRequest'
                  github: '#/components/schemas/CreateGitHubProviderRequest'
      responses:
        '201':
          description: Registered at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfProvider'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfProvider'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/providers/{id}/refresh:
    post:
      operationId: refreshProvider
      summary: Run Proxmox discovery now and return the provider as the sync left it.
      description: >-
        The same discovery the provider runs every sync interval (action `provider.read`; it writes observations
        and discovered nodes only). Concurrent refreshes of one provider share a single run. A cluster that cannot
        be read is not an error of this call: the provider's `status` is `error`. Rate-limited per caller and
        provider; over the limit the answer is 429 with `Retry-After`. Takes no `Idempotency-Key`.
      tags: [providers]
      x-supermgmt-route: action:provider.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The provider after the sync.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Provider'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      summary: One page of nodes with their latest observations.
      tags: [nodes]
      x-supermgmt-route: action:node.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: environment, in: query, required: false, description: Only nodes in this environment., schema: {type: string}}
        - {name: tag, in: query, required: false, description: Only nodes with this tag., schema: {type: string}}
        - {name: reachability, in: query, required: false, description: Only nodes with this reachability., schema: {type: string}}
      responses:
        '200':
          description: A page of nodes.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfNode'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/ssh/host-key:
    post:
      operationId: scanHostKey
      summary: Read-only keyscan for the first-trust confirmation.
      tags: [nodes]
      x-supermgmt-route: action:node.add
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScanHostKeyRequest'}
      responses:
        '200':
          description: The scanned host key.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/HostKey'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/ssh:
    post:
      operationId: addSSHNode
      summary: Add a node reached over SSH.
      tags: [nodes]
      x-supermgmt-route: action:node.add
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddSSHNodeRequest'}
      responses:
        '201':
          description: Added at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}:
    get:
      operationId: getNode
      summary: A node with its latest observations.
      tags: [nodes]
      x-supermgmt-route: action:node.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: focus, in: query, required: false, description: Refresh observations of a node the client is looking at., schema: {type: boolean}}
      responses:
        '200':
          description: The node.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Node'}}}]}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateNode
      summary: Change a node; absent fields are unchanged.
      tags: [nodes]
      x-supermgmt-route: action:node.update
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodePatch'}
      responses:
        '200':
          description: Updated at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeNode
      summary: Remove a node from management.
      tags: [nodes]
      x-supermgmt-route: action:node.remove
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Removed at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfNode'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/probe:
    post:
      operationId: probeNode
      summary: Probe a node.
      tags: [nodes]
      x-supermgmt-route: action:node.probe
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {$ref: '#/components/responses/Submission'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/services:
    get:
      operationId: listNodeServices
      summary: The services of a node.
      tags: [nodes]
      x-supermgmt-route: action:service.read
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of services.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfService'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/connect-info:
    get:
      operationId: getNodeConnectInfo
      summary: What an interactive client needs to run OpenSSH against a node.
      tags: [nodes]
      x-supermgmt-route: action:node.connect
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The connection details.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/ConnectInfo'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/sessions:
    post:
      operationId: openNodeSession
      summary: Open an interactive session on a node.
      tags: [nodes]
      x-supermgmt-route: action:node.connect
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenSessionRequest'}
      responses:
        '201':
          description: The session and how to reach the node.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/SessionOpened'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes/{id}/sessions/{sid}/end:
    post:
      operationId: endNodeSession
      summary: End an interactive session; the first end wins.
      tags: [nodes]
      x-supermgmt-route: action:node.connect
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Sid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndSessionRequest'}
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Session'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/services/{id}:
    get:
      operationId: getService
      summary: A service with the verbs its node advertises.
      tags: [services]
      x-supermgmt-route: action:service.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The service.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/Service'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/services/{id}/logs:
    get:
      operationId: getServiceLogs
      summary: Sanitized log lines of a service, oldest first.
      tags: [services]
      x-supermgmt-route: action:service.logs
      parameters:
        - $ref: '#/components/parameters/Id'
        - {name: lines, in: query, required: false, description: Number of lines; 0 or absent means 200., schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        '200':
          description: The log lines.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/LogChunk'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/services/{id}/actions/start:
    post:
      operationId: startService
      summary: Start a service.
      tags: [services]
      x-supermgmt-route: action:service.start
      parameters:
        - $ref: '#/components/parameters/Id'
