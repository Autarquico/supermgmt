      responses:
        '201':
          description: Created at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfApp'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfApp'}}}]}
