    get:
      operationId: getDeployment
      summary: A deployment with its steps.
      tags: [deployments]
      x-supermgmt-route: action:deployment.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': {$ref: '#/components/responses/Deployment'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/deployments/{id}/rollback:
    post:
      operationId: rollbackDeployment
      summary: Roll the target back to a known-good deployment.
      description: The body is optional; without `to_deployment_id` the newest known-good deployment of the same target older than `{id}` is used.
      tags: [deployments]
      x-supermgmt-route: action:deployment.rollback
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '202': {$ref: '#/components/responses/Deployment'}
        default: {$ref: '#/components/responses/Error'}
