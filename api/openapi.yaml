      operationId: updateAppTarget
      summary: Change the deployment policy of a target.
      description: Environment, node and Compose project never change.
      tags: [apps]
      x-supermgmt-route: action:app_target.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppTargetPatch'}
      responses:
        '200':
          description: Updated at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfAppTarget'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfAppTarget'}}}]}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/deployments:
    get:
      operationId: listDeployments
      summary: Deployments, newest first, optionally filtered.
      tags: [deployments]
      x-supermgmt-route: action:deployment.read
      parameters:
        - {name: app_id, in: query, required: false, description: Only deployments of this app., schema: {$ref: '#/components/schemas/ID'}}
        - {name: app_target_id, in: query, required: false, description: Only deployments of this target., schema: {$ref: '#/components/schemas/ID'}}
        - {name: environment_id, in: query, required: false, description: Only deployments to this environment., schema: {$ref: '#/components/schemas/ID'}}
        - {name: state, in: query, required: false, description: Only deployments in this state., schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deployments.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/PageOfDeployment'}}}]}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDeployment
      summary: Request a deployment of a commit and its image digests to one target.
      description: >-
        Callable by a person or by a GitHub Actions OIDC credential. The deployment starts provisional
        (`created`, then `waiting_ci`); SuperMgmt verifies the required checks and the artifact provenance
        itself before it becomes a plan, so the request is no evidence that tests passed.
      tags: [deployments]
      x-supermgmt-route: action:deployment.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDeploymentRequest'}
      responses:
        '202': {$ref: '#/components/responses/Deployment'}
        default: {$ref: '#/components/responses/Error'}
