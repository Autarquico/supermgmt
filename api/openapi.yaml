      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The target.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/AppTarget'}}}]}
        default: {$ref: '#/components/responses/Error'}
