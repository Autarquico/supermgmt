      x-supermgmt-route: action:app.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppPatch'}
      responses:
        '200':
          description: Updated at once.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfApp'}}}]}
        '202':
          description: Awaiting approval; a control_plane.apply job was created.
          content:
            application/json:
              schema: {allOf: [{$ref: '#/components/schemas/Envelope'}, {properties: {data: {$ref: '#/components/schemas/DirectOfApp'}}}]}
